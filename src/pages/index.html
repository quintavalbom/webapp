<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinta Valbom - Welkom</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🏕️</div>
      <div class="header-text">
        <h1>Quinta Valbom</h1>
        <p>Happy Healthy Holidays</p>
      </div>
    </header>

    <main>
      <div class="card" style="text-align: center; margin-top: 40px;">
        <div style="font-size: 48px; margin-bottom: 20px;">👋</div>
        <h2 style="margin-bottom: 12px;">Welkom!</h2>
        <p style="color: var(--muted); margin-bottom: 32px;">Voer je gegevens in om te beginnen</p>

        <form id="onboarding-form">
          <label style="text-align: left;">Jouw naam</label>
          <input type="text" id="name" placeholder="Bijv. Jan" required>

          <label style="text-align: left;">Plekkenummer</label>
          <select id="plek" required>
            <option value="">-- Selecteer --</option>
          </select>

          <button type="submit">Starten</button>
          <div id="error" class="error" style="display: none;"></div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    // Fill pitch numbers
    const plekSelect = document.getElementById('plek');
    for (let i = 1; i <= 30; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `Plek ${i}`;
      plekSelect.appendChild(option);
    }

    // Auto-fill from URL
    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get('plek')) {
      plekSelect.value = urlParams.get('plek');
    }

    document.getElementById('onboarding-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const plek = document.getElementById('plek').value;

      if (!name || !plek) {
        document.getElementById('error').textContent = 'Vul alle velden in';
        document.getElementById('error').style.display = 'block';
        return;
      }

      // Save to localStorage
      localStorage.setItem('qv_user', JSON.stringify({ name, plek: parseInt(plek) }));

      // Redirect to app
      window.location.href = './app.html?plek=' + plek;
    });
  </script>
</body>
</html>
