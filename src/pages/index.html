<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Quinta Valbom - Welkom</title>
  <link rel="stylesheet" href="../css/style.css?v=20260506">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="../img/logo.png" alt="Quinta Valbom"></div>
      <div class="header-text">
        <h1>Quinta Valbom</h1>
        <p>Happy Healthy Holidays</p>
      </div>
    </header>

    <main>
      <div class="card" style="text-align: center; margin-top: 40px;">
        <div style="font-size: 48px; margin-bottom: 20px;">👋</div>
        <h2 style="margin-bottom: 12px;">Welkom bij Quinta Valbom!</h2>
        <p style="color: var(--muted); margin-bottom: 32px;">Voer je gegevens in om te beginnen</p>

        <form id="onboarding-form">
          <label style="text-align: left;">Jouw naam</label>
          <input type="text" id="name" placeholder="Bijv. Jan" required>

          <label style="text-align: left;">Pleknummer</label>
          <select id="plek" required>
            <option value="">-- Selecteer --</option>
          </select>

          <button type="submit">Starten</button>
          <div id="error" class="error" style="display: none;"></div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=20260506"></script>
  <script>
    // Check if user already onboarded
    const urlParams = new URLSearchParams(location.search);
    const forceOnboarding = urlParams.get('reset') === '1';
    const existingUser = localStorage.getItem('qv_user');

    if (existingUser && !forceOnboarding) {
      try {
        const user = JSON.parse(existingUser);
        if (user.name && user.plek) {
          // Skip onboarding, go straight to app
          window.location.href = './app.html?plek=' + user.plek;
        }
      } catch (e) {
        // Invalid data, clear it
        localStorage.removeItem('qv_user');
      }
    }

    // Fill pitch numbers — only show pleks that are NOT occupied
    const plekSelect = document.getElementById('plek');
    const errorEl = document.getElementById('error');

    async function fillPleks() {
      // Reset
      plekSelect.innerHTML = '<option value="">-- Laden... --</option>';

      // Fetch occupied pleks
      let occupied = new Set();
      try {
        const result = await getGuests();
        if (result.success) {
          (result.data || []).forEach(g => occupied.add(g.plek));
        }
      } catch (e) {
        console.error('Could not load guests:', e);
      }

      plekSelect.innerHTML = '<option value="">-- Selecteer --</option>';
      let added = 0;
      for (let i = 1; i <= 30; i++) {
        if (occupied.has(i)) continue;
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Plek ${i}`;
        plekSelect.appendChild(option);
        added++;
      }

      if (added === 0) {
        plekSelect.innerHTML = '<option value="">Alle plekken bezet</option>';
        errorEl.textContent = 'Alle plekken zijn momenteel bezet. Neem contact op met de bar.';
        errorEl.style.display = 'block';
      }

      // Auto-fill from URL only if available
      if (urlParams.get('plek') && !occupied.has(parseInt(urlParams.get('plek')))) {
        plekSelect.value = urlParams.get('plek');
      }
    }

    fillPleks();

    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const plek = document.getElementById('plek').value;
      const errorEl = document.getElementById('error');

      if (!name || !plek) {
        errorEl.textContent = 'Vul alle velden in';
        errorEl.style.display = 'block';
        return;
      }

      // Final check: is this plek still available?
      try {
        const result = await getGuests();
        if (result.success) {
          const occupied = (result.data || []).some(g => g.plek === parseInt(plek));
          if (occupied) {
            errorEl.textContent = 'Deze plek is net door iemand anders ingenomen. Kies een andere plek.';
            errorEl.style.display = 'block';
            await fillPleks();
            return;
          }
        }
      } catch (err) {
        console.error('Could not verify plek:', err);
      }

      // Save guest to Supabase (must succeed before continuing)
      const saveResult = await saveGuest(name, parseInt(plek));
      if (!saveResult.success) {
        errorEl.textContent = 'Kon je niet aanmelden. Probeer opnieuw.';
        errorEl.style.display = 'block';
        return;
      }

      // Save to localStorage
      localStorage.setItem('qv_user', JSON.stringify({ name, plek: parseInt(plek) }));

      // Redirect to app
      window.location.href = './app.html?plek=' + plek;
    });
  </script>
</body>
</html>
