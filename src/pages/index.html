<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Quinta Valbom - Welkom</title>
  <link rel="stylesheet" href="../css/style.css?v=20260506">
  <style>
    .lang-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .lang-btn {
      flex: 1;
      min-width: 64px;
      padding: 10px 8px;
      background: white;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
    }
    .lang-btn.active {
      background: var(--qv);
      color: white;
      border-color: var(--qv);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><img src="../img/logo.png" alt="Quinta Valbom"></div>
      <div class="header-text">
        <h1>Quinta Valbom</h1>
        <p>Happy Healthy Holidays</p>
      </div>
    </header>

    <main>
      <div class="card" style="text-align: center; margin-top: 20px;">
        <div style="font-size: 48px; margin-bottom: 16px;">👋</div>
        <h2 style="margin-bottom: 8px;" data-i18n="welcome_title">Welkom bij Quinta Valbom!</h2>
        <p style="color: var(--muted); margin-bottom: 24px;" data-i18n="welcome_sub">Voer je gegevens in om te beginnen</p>

        <form id="onboarding-form">
          <label style="text-align: left;" data-i18n="lang_label">Taal</label>
          <div class="lang-buttons" id="lang-buttons">
            <button type="button" class="lang-btn" data-lang="nl">🇳🇱 NL</button>
            <button type="button" class="lang-btn" data-lang="en">🇬🇧 EN</button>
            <button type="button" class="lang-btn" data-lang="pt">🇵🇹 PT</button>
            <button type="button" class="lang-btn" data-lang="es">🇪🇸 ES</button>
            <button type="button" class="lang-btn" data-lang="de">🇩🇪 DE</button>
            <button type="button" class="lang-btn" data-lang="fr">🇫🇷 FR</button>
          </div>

          <label style="text-align: left;" data-i18n="name_label">Jouw naam</label>
          <input type="text" id="name" data-i18n-placeholder="name_placeholder" placeholder="Bijv. Jan" required>

          <label style="text-align: left;" data-i18n="plek_label">Pleknummer</label>
          <select id="plek" required>
            <option value="">--</option>
          </select>

          <button type="submit" data-i18n="start_btn">Starten</button>
          <div id="error" class="error" style="display: none;"></div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/i18n.js?v=20260509"></script>
  <script src="../js/supabase.js?v=20260509"></script>
  <script>
    // Check if user already onboarded
    const urlParams = new URLSearchParams(location.search);
    const forceOnboarding = urlParams.get('reset') === '1';
    const existingUser = localStorage.getItem('qv_user');

    if (existingUser && !forceOnboarding) {
      try {
        const user = JSON.parse(existingUser);
        if (user.name && user.plek) {
          window.location.href = './app.html?plek=' + user.plek;
        }
      } catch (e) {
        localStorage.removeItem('qv_user');
      }
    }

    // Init translations
    applyTranslations();
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === getLang());
      btn.addEventListener('click', () => {
        setLang(btn.dataset.lang);
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === btn.dataset.lang));
        applyTranslations();
      });
    });

    const plekSelect = document.getElementById('plek');
    const errorEl = document.getElementById('error');

    async function fillPleks() {
      plekSelect.innerHTML = `<option value="">${t('plek_loading')}</option>`;
      let occupied = new Set();
      try {
        const result = await getGuests();
        if (result.success) {
          (result.data || []).forEach(g => occupied.add(g.plek));
        }
      } catch (e) { console.error(e); }

      plekSelect.innerHTML = `<option value="">${t('plek_select')}</option>`;
      let added = 0;
      for (let i = 1; i <= 30; i++) {
        if (occupied.has(i)) continue;
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Plek ${i}`;
        plekSelect.appendChild(option);
        added++;
      }

      if (added === 0) {
        plekSelect.innerHTML = `<option value="">${t('plek_full')}</option>`;
        errorEl.textContent = t('plek_full_msg');
        errorEl.style.display = 'block';
      }

      if (urlParams.get('plek') && !occupied.has(parseInt(urlParams.get('plek')))) {
        plekSelect.value = urlParams.get('plek');
      }
    }

    fillPleks();

    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const plek = document.getElementById('plek').value;

      if (!name || !plek) {
        errorEl.textContent = t('fill_all');
        errorEl.style.display = 'block';
        return;
      }

      try {
        const result = await getGuests();
        if (result.success) {
          const occupied = (result.data || []).some(g => g.plek === parseInt(plek));
          if (occupied) {
            errorEl.textContent = t('plek_taken');
            errorEl.style.display = 'block';
            await fillPleks();
            return;
          }
        }
      } catch (err) { console.error(err); }

      const saveResult = await saveGuest(name, parseInt(plek));
      if (!saveResult.success) {
        errorEl.textContent = t('save_failed');
        errorEl.style.display = 'block';
        return;
      }

      localStorage.setItem('qv_user', JSON.stringify({ name, plek: parseInt(plek) }));
      window.location.href = './app.html?plek=' + plek;
    });
  </script>
</body>
</html>
